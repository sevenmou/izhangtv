<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>保卫张星星 · i张TV</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
  :root{
    --bg:#07080b; --panel:#0e1117; --line:rgba(255,255,255,.1);
    --ink:#eaf0f4; --dim:#9aa5b2; --cyan:#74f0d8; --pink:#ff6f92; --gold:#ffd166;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    background-image:
      radial-gradient(900px 520px at 10% -10%, rgba(116,240,216,.12), transparent 62%),
      radial-gradient(760px 520px at 96% 8%, rgba(255,111,146,.1), transparent 60%);
    min-height:100dvh;
  }
  .app{
    width:min(1000px, 100vw - 24px);margin:14px auto;
    display:flex;flex-direction:column;gap:10px;
  }
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:2px 4px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.02em}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .brand b{font-weight:700}
  .brand span{color:var(--dim);font-size:12px;letter-spacing:.14em}
  .grow{flex:1}
  .stat{
    display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    background:rgba(255,255,255,.03);
  }
  .stat b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  button{
    appearance:none;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:7px 14px;transition:.18s;
  }
  button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
  button.primary{background:rgba(116,240,216,.14);border-color:rgba(116,240,216,.5);color:#cffff4}
  button.primary:hover{background:rgba(116,240,216,.22)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stage{
    position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    background:#05070a;
  }
  canvas{display:block;width:100%;height:auto;touch-action:manipulation}
  .hint{font-size:12px;color:#7d8794;text-align:center;padding-bottom:6px}

  /* 建塔面板 */
  .panel{
    position:fixed;left:50%;bottom:-10px;transform:translate(-50%,20px);
    width:min(560px, 94vw);z-index:30;
    background:rgba(12,15,21,.96);border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:12px;backdrop-filter:blur(14px);
    opacity:0;pointer-events:none;transition:.22s cubic-bezier(.22,.7,.25,1);
  }
  .panel.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .panel h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.06em}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .opt{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 6px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    transition:.16s;
  }
  .opt:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.26);transform:translateY(-2px)}
  .opt.poor{opacity:.45;cursor:not-allowed}
  .opt img{width:44px;height:44px;border-radius:50%}
  .opt .nm{font-size:12px}
  .opt .pr{font-size:11px;color:var(--gold)}
  .panel .row{display:flex;gap:8px;margin-top:8px}
  .panel .row button{flex:1}
  .msg{font-size:12px;color:var(--pink);min-height:16px;margin-top:6px}

  /* 结算 */
  .over{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(4,6,9,.72);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:.25s;
  }
  .over.on{opacity:1;pointer-events:auto}
  .over .card{
    width:min(420px, 88vw);text-align:center;padding:26px 22px;
    background:linear-gradient(170deg,#12161f,#0b0e14);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);
  }
  .over h2{margin:0 0 6px;font-size:24px}
  .over p{margin:0 0 16px;color:var(--dim);font-size:13px;line-height:1.6}
  .over .btns{display:flex;gap:10px;justify-content:center}
  @media (max-width:640px){
    header{gap:8px}
    .brand span{display:none}
    .stat{font-size:12px;padding:4px 9px}
    button{font-size:12px;padding:6px 11px}
    .opt img{width:38px;height:38px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><b>保卫张星星</b><span>DEFEND ZHANG</span></div>
    <div class="grow"></div>
    <div class="stat">金币 <b id="hCoins">240</b></div>
    <div class="stat">波次 <b id="hWave">0</b>/10</div>
    <div class="stat">生命 <b id="hLife">20</b></div>
    <div class="acts">
      <button class="primary" id="btnWave">开始第 1 波</button>
      <button id="btnSpeed">×1</button>
      <button id="btnPause">暂停</button>
    </div>
  </header>

  <div class="stage"><canvas id="cv" width="960" height="640"></canvas></div>
  <div class="hint">点虚线空位建塔 · 点已有塔可升级或卖掉 · 别让黑化的张星星走到右边</div>
</div>

<div class="panel" id="panel">
  <h3 id="panelTitle">这个位置建什么塔</h3>
  <div class="opts" id="opts"></div>
  <div class="row" id="panelRow"></div>
  <div class="msg" id="panelMsg"></div>
</div>

<div class="over" id="over">
  <div class="card">
    <h2 id="overTitle">守住了</h2>
    <p id="overText"></p>
    <div class="btns">
      <button class="primary" id="btnAgain">再来一局</button>
    </div>
  </div>
</div>

<script>
/* ================= 基础配置 ================= */
const W = 960, H = 640;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const PATH = [[-50,140],[240,140],[240,420],[620,420],[620,180],[880,180]];
const segLen = [];
let totalLen = 0;
for(let i=0;i<PATH.length-1;i++){
  const dx = PATH[i+1][0]-PATH[i][0], dy = PATH[i+1][1]-PATH[i][1];
  const len = Math.hypot(dx,dy);
  segLen.push(len); totalLen += len;
}
function pointAt(d){
  d = Math.max(0, Math.min(totalLen, d));
  let acc = 0;
  for(let i=0;i<segLen.length;i++){
    if(d <= acc + segLen[i]){
      const t = (d-acc)/segLen[i];
      return {
        x: PATH[i][0] + (PATH[i+1][0]-PATH[i][0])*t,
        y: PATH[i][1] + (PATH[i+1][1]-PATH[i][1])*t
      };
    }
    acc += segLen[i];
  }
  return {x:PATH[PATH.length-1][0], y:PATH[PATH.length-1][1]};
}

/* 6 个建造点 */
const SPOTS = [
  {x:120, y:255}, {x:352, y:256}, {x:352, y:530},
  {x:512, y:530}, {x:726, y:318}, {x:762, y:78}
];

const BASE = {x:905, y:180, r:46};

/* 塔配置 */
const TOWERS = {
  pea:  {name:'墨镜豌豆', img:'tower1.png', cost:60,  dmg:10, cd:0.45, range:170, color:'#74f0d8', kind:'shot'},
  ice:  {name:'奶龙冰塔', img:'tower2.png', cost:110, dmg:5,  cd:0.75, range:150, color:'#8fc6ff', kind:'ice'},
  boom: {name:'天使重炮', img:'tower3.png', cost:180, dmg:32, cd:1.5,  range:180, color:'#ffb36b', kind:'boom'}
};
const UPGRADE = [1, .8, 1.15];   // 各级升级价 = cost * 系数

/* 波次 */
const WAVES = [
  {n:8,  gap:.85, hp:42,  spd:52},
  {n:10, gap:.8,  hp:54,  spd:54},
  {n:12, gap:.75, hp:70,  spd:56},
  {n:12, gap:.72, hp:88,  spd:58, elite:2},
  {n:14, gap:.68, hp:108, spd:60, elite:3},
  {n:15, gap:.64, hp:132, spd:62, elite:4},
  {n:16, gap:.6,  hp:158, spd:64, elite:5},
  {n:16, gap:.56, hp:184, spd:66, elite:6},
  {n:18, gap:.52, hp:212, spd:66, elite:8},
  {n:18, gap:.5,  hp:244, spd:68, elite:9, boss:1}
];

/* 图片 */
const IMG = {};
function loadImg(key, src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = () => { IMG[key] = im; res(); };
    im.onerror = () => res();
    im.src = src;
  });
}
const ALL_IMGS = [
  ['base','base.png'],['pea','tower1.png'],['ice','tower2.png'],['boom','tower3.png']
];

/* 状态 */
const G = {
  coins:240, life:20, wave:0, running:false, paused:false, speed:1,
  enemies:[], towers:[], shots:[], parts:[], spawnQ:[], spawnT:0,
  baseShake:0, t:0, over:false, killed:0
};

function reset(){
  G.coins = 240; G.life = 20; G.wave = 0; G.running = false; G.paused = false; G.speed = 1;
  G.enemies = []; G.towers = []; G.shots = []; G.parts = []; G.spawnQ = []; G.spawnT = 0;
  G.baseShake = 0; G.over = false; G.killed = 0;
  syncHud(); closePanel(); document.getElementById('over').classList.remove('on');
  document.getElementById('btnWave').disabled = false;
  document.getElementById('btnSpeed').textContent = '×1';
  document.getElementById('btnPause').textContent = '暂停';
}
function syncHud(){
  document.getElementById('hCoins').textContent = Math.floor(G.coins);
  document.getElementById('hWave').textContent = G.wave;
  document.getElementById('hLife').textContent = G.life;
}
/* ================= 视觉工具 ================= */
function circle(x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.5; ctx.stroke(); }
}
function drawSticker(key, x, y, size){
  const im = IMG[key];
  if(!im) return;
  ctx.drawImage(im, x-size/2, y-size/2, size, size);
}
function addParts(x, y, n, color, power){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (Math.random()*0.8+0.3)*power;
    G.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0.5+Math.random()*0.35, age:0, color, r:1.6+Math.random()*2.4});
  }
}

/* ================= 背景 ================= */
function drawBg(){
  const g = ctx.createRadialGradient(W*0.2, 40, 60, W*0.2, 40, W*0.9);
  g.addColorStop(0, '#0d131c'); g.addColorStop(1, '#06080c');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
  for(let x=0; x<=W; x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<=H; y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  /* 路径 */
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(PATH[0][0], PATH[0][1]);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i][0], PATH[i][1]);
  ctx.lineWidth = 64;
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.stroke();
  ctx.lineWidth = 62;
  ctx.strokeStyle = 'rgba(116,240,216,.3)';
  ctx.setLineDash([3,0]);
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* 中线虚线 */
  ctx.beginPath();
  ctx.moveTo(PATH[0][0], PATH[0][1]);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i][0], PATH[i][1]);
  ctx.setLineDash([10,14]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(116,240,216,.42)';
  ctx.stroke();
  ctx.setLineDash([]);

  /* 入口箭头 */
  ctx.fillStyle = 'rgba(255,111,146,.5)';
  ctx.font = '12px sans-serif';
  ctx.fillText('黑化张星星从这里来 →', 12, 108);
}

/* ================= 基地 ================= */
function drawBase(){
  const pulse = 1 + Math.sin(G.t*2.2)*0.05;
  const sh = G.baseShake;
  /* 光环 */
  const rg = ctx.createRadialGradient(BASE.x, BASE.y, 8, BASE.x, BASE.y, BASE.r*2.1);
  rg.addColorStop(0, 'rgba(116,240,216,.35)'); rg.addColorStop(1,'rgba(116,240,216,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(BASE.x-BASE.r*2.2, BASE.y-BASE.r*2.2, BASE.r*4.4, BASE.r*4.4);

  const x = BASE.x + (sh>0 ? (Math.random()-.5)*sh*10 : 0);
  const y = BASE.y + (sh>0 ? (Math.random()-.5)*sh*10 : 0);
  /* 圆盘 */
  circle(x, y, BASE.r*1.12, 'rgba(255,255,255,.06)', 'rgba(116,240,216,.45)', 2);
  drawSticker('base', x, y, BASE.r*2*pulse);
  /* 生命条 */
  const bw = 92, bh = 6, bx = BASE.x-bw/2, by = BASE.y-BASE.r-24;
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(bx-1, by-1, bw+2, bh+2);
  const p = Math.max(0, G.life/20);
  ctx.fillStyle = p>0.5 ? '#74f0d8' : (p>0.25 ? '#ffd166' : '#ff6f92');
  ctx.fillRect(bx, by, bw*p, bh);
  ctx.fillStyle = 'rgba(234,240,244,.75)';
  ctx.font = '600 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('基地 ' + G.life + ' / 20', BASE.x, by-6);
  ctx.textAlign = 'left';
}

/* ================= 塔 / 敌人 / 子弹 ================= */
function drawTower(t){
  circle(t.x, t.y+6, 33, 'rgba(255,255,255,.05)', 'rgba(255,255,255,.16)', 1.6);
  const s = 63 + Math.sin(G.t*1.8 + t.x*0.05)*1.8;
  ctx.save();
  ctx.translate(t.x, t.y-6);
  ctx.rotate(Math.sin(G.t*0.9 + t.x)*0.05);
  drawSticker(t.key, 0, 0, s);
  ctx.restore();
  /* 枪管：朝最后的目标 */
  if(t.aim != null){
    ctx.save();
    ctx.translate(t.x, t.y-6); ctx.rotate(t.aim);
    const grd = ctx.createLinearGradient(18,0,36,0);
    grd.addColorStop(0,'rgba(255,255,255,.55)'); grd.addColorStop(1,'rgba(255,255,255,.05)');
    ctx.strokeStyle = grd; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(36,0); ctx.stroke();
    ctx.restore();
  }
  /* 等级点 */
  for(let i=0;i<t.lv;i++){
    circle(t.x - 9 + i*9, t.y+26, 3, t.color, null);
  }
  /* 选中高亮 */
  if(t.sel) circle(t.x, t.y+6, 37, null, 'rgba(255,255,255,.62)', 2);
}

function drawEnemy(e){
  const r = e.r;
  ctx.beginPath(); ctx.ellipse(e.x, e.y+r*0.92, r*0.82, r*0.3, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.fill();

  if(IMG.base){
    ctx.save();
    ctx.filter = e.boss ? 'brightness(.42) saturate(.3) contrast(1.1)' : 'brightness(.62) saturate(.45)';
    ctx.drawImage(IMG.base, e.x-r, e.y-r, r*2, r*2);
    ctx.restore();
  }
  circle(e.x, e.y, r+1, null, e.boss ? 'rgba(255,70,120,.95)' : 'rgba(255,100,100,.62)', e.boss?4:2);
  if(e.slowT > 0){
    circle(e.x, e.y, r+4, null, 'rgba(143,198,255,.75)', 2);
  }
  const bw = r*1.9, bh = 3.5, bx = e.x-bw/2, by = e.y-r-9;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx-1, by-1, bw+2, bh+2);
  const p = Math.max(0, e.hp/e.maxHp);
  ctx.fillStyle = p>0.55 ? '#8ee06a' : (p>0.28 ? '#ffd166' : '#ff6f92');
  ctx.fillRect(bx, by, bw*p, bh);
}

function drawShots(){
  for(const s of G.shots){
    const c = s.kind==='ice' ? '#8fc6ff' : (s.kind==='boom' ? '#ffb36b' : '#b9fff0');
    ctx.globalAlpha = .35;
    circle(s.x, s.y, s.r*2.2, c, null);
    ctx.globalAlpha = 1;
    circle(s.x, s.y, s.r, c, 'rgba(255,255,255,.85)', 1.4);
  }
}

function drawParts(){
  for(const p of G.parts){
    const k = 1 - p.age/p.life;
    ctx.globalAlpha = Math.max(0, k);
    circle(p.x, p.y, p.r*k, p.color, null);
  }
  ctx.globalAlpha = 1;
}

function drawSpots(){
  for(const s of SPOTS){
    const t = G.towers.find(t=>t.sx===s.x && t.sy===s.y);
    if(t) continue;
    ctx.save();
    ctx.setLineDash([6,6]);
    circle(s.x, s.y+6, 28, 'rgba(255,255,255,.03)', 'rgba(255,255,255,.16)', 1.5);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.font = '600 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('+', s.x, s.y+13);
    ctx.restore();
  }
  ctx.textAlign='left';
}

function render(){
  drawBg();
  drawSpots();
  drawBase();
  for(const t of G.towers) drawTower(t);
  for(const e of G.enemies) drawEnemy(e);
  drawShots();
  drawParts();
  if(G.paused && G.running){
    ctx.fillStyle = 'rgba(4,6,9,.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#eaf0f4'; ctx.font = '600 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('已暂停', W/2, H/2);
    ctx.textAlign='left';
  }
}
/* ================= 逻辑 ================= */
const btnWave = document.getElementById('btnWave');
const btnSpeed = document.getElementById('btnSpeed');
const btnPause = document.getElementById('btnPause');

function spawnEnemy(s){
  const e = {
    d: s.d0 || 0, x:0, y:0, hp: s.hp, maxHp: s.hp,
    spd: s.spd, r: s.boss ? 30 : (s.elite ? 22 : 17),
    elite: !!s.elite, boss: !!s.boss, slowT: 0, dead: false,
    reward: s.reward, leak: s.boss ? 6 : (s.elite ? 3 : 1)
  };
  const p = pointAt(e.d); e.x = p.x; e.y = p.y;
  G.enemies.push(e);
}

function startWave(){
  if(G.running || G.over || G.wave >= WAVES.length) return;
  const w = WAVES[G.wave];
  G.wave++;
  syncHud();
  const q = [];
  const eliteEvery = w.elite ? Math.max(3, Math.round(w.n / w.elite)) : 0;
  for(let i=0;i<w.n;i++){
    const elite = eliteEvery && (i % eliteEvery === eliteEvery-1);
    const boss = w.boss && i === w.n-1;
    let hp = w.hp * (1 + i*0.03) * (elite ? 2.5 : 1) * (boss ? 7 : 1);
    hp = Math.round(hp);
    q.push({
      hp, spd: w.spd * (elite ? .88 : 1) * (boss ? .7 : 1),
      elite, boss, gap: w.gap,
      reward: Math.max(7, Math.round(hp * (boss ? .14 : .2)))
    });
  }
  G.spawnQ = q;
  G.spawnT = 0.4;
  G.running = true;
  btnWave.disabled = true;
  btnWave.textContent = '第 ' + G.wave + ' 波进行中';
}

function findTarget(t){
  let best = null, bestD = -1;
  for(const e of G.enemies){
    if(e.dead) continue;
    if(Math.hypot(e.x-t.x, e.y-t.y) <= t.range && e.d > bestD){ bestD = e.d; best = e; }
  }
  return best;
}

function fire(t, tg){
  const spd = t.kind === 'boom' ? 300 : 520;
  G.shots.push({
    x: t.x, y: t.y-8, tx: tg.x, ty: tg.y, tgt: tg,
    kind: t.kind, dmg: t.dmg, spd, r: t.kind==='boom' ? 7 : 4,
    splash: t.kind==='boom' ? 86 : 0, dead:false
  });
  addParts(t.x, t.y-8, 3, t.color, 1.6);
}

function damage(e, d){
  if(e.dead) return;
  e.hp -= d;
  if(e.hp <= 0){
    e.dead = true; G.killed++;
    G.coins += e.reward; syncHud();
    addParts(e.x, e.y, e.boss ? 26 : 11, '#8ee06a', e.boss ? 6 : 3.6);
  }
}

function hitShot(s){
  if(s.kind === 'boom'){
    for(const e of G.enemies){
      if(!e.dead && Math.hypot(e.x-s.x, e.y-s.y) <= s.splash) damage(e, s.dmg);
    }
    addParts(s.x, s.y, 18, '#ffb36b', 5.5);
  }else{
    const e = s.tgt;
    if(e && !e.dead){
      damage(e, s.dmg);
      if(s.kind === 'ice') e.slowT = 2.4;
      addParts(s.x, s.y, 6, s.kind==='ice' ? '#8fc6ff' : '#b9fff0', 2.6);
    }
  }
}

function gameOver(win){
  G.over = true; G.running = false;
  btnWave.disabled = true;
  document.getElementById('overTitle').textContent = win ? '守住了！' : '基地被攻破了';
  document.getElementById('overText').innerHTML = win
    ? '10 波黑化张星星全部清空，击杀 ' + G.killed + ' 只，剩余生命 ' + G.life + '。'
    : '打到第 ' + G.wave + ' 波，击杀 ' + G.killed + ' 只。再摆一次塔试试。';
  document.getElementById('over').classList.add('on');
}

function update(dt){
  G.t += dt;
  if(G.baseShake > 0) G.baseShake = Math.max(0, G.baseShake - dt*3.5);

  if(G.spawnQ.length){
    G.spawnT -= dt;
    if(G.spawnT <= 0){
      const s = G.spawnQ.shift();
      spawnEnemy(s);
      G.spawnT = s.gap;
    }
  }

  for(const e of G.enemies){
    if(e.dead) continue;
    let spd = e.spd;
    if(e.slowT > 0){ e.slowT -= dt; spd *= 0.45; }
    e.d += spd*dt;
    const p = pointAt(e.d);
    e.x = p.x; e.y = p.y;
    if(e.d >= totalLen - 4){
      e.dead = true; e.leaked = true;
      G.life -= e.leak;
      G.baseShake = 1;
      addParts(BASE.x, BASE.y, 14, '#ff6f92', 4.5);
      syncHud();
      if(G.life <= 0){ G.life = 0; syncHud(); gameOver(false); return; }
    }
  }
  G.enemies = G.enemies.filter(e=>!e.dead);

  for(const t of G.towers){
    t.cd -= dt;
    if(t.cd <= 0){
      const tg = findTarget(t);
      if(tg){ t.aim = Math.atan2(tg.y-(t.y-6), tg.x-t.x); t.cd = t.cdMax; fire(t, tg); }
    }
  }

  for(const s of G.shots){
    if(s.dead) continue;
    const tg = s.tgt;
    if(tg && !tg.dead){ s.tx = tg.x; s.ty = tg.y; }
    const dx = s.tx - s.x, dy = s.ty - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    if(dist < 12){ s.dead = true; hitShot(s); continue; }
    const v = s.spd*dt;
    s.x += dx/dist*Math.min(v, dist);
    s.y += dy/dist*Math.min(v, dist);
  }
  G.shots = G.shots.filter(s=>!s.dead);

  for(const p of G.parts){
    p.age += dt;
    p.x += p.vx; p.y += p.vy;
    p.vy += 22*dt; p.vx *= 0.985; p.vy *= 0.985;
  }
  G.parts = G.parts.filter(p=>p.age < p.life);

  if(G.running && !G.spawnQ.length && !G.enemies.length && !G.over){
    G.running = false;
    G.coins += 55; syncHud();
    if(G.wave >= WAVES.length){ gameOver(true); }
    else{
      btnWave.disabled = false;
      btnWave.textContent = '开始第 ' + (G.wave+1) + ' 波';
    }
  }
}

/* ================= 主循环 ================= */
let lastT = 0;
function frame(now){
  const raw = lastT ? (now - lastT)/1000 : 0;
  lastT = now;
  if(!G.paused && !G.over){
    const steps = G.speed;
    const dt = Math.min(0.033, raw);
    for(let i=0;i<steps;i++) update(dt);
  }
  render();
  requestAnimationFrame(frame);
}

/* ================= 面板 / 交互 ================= */
const panel = document.getElementById('panel');
const opts = document.getElementById('opts');
const panelRow = document.getElementById('panelRow');
const panelTitle = document.getElementById('panelTitle');
const panelMsg = document.getElementById('panelMsg');
let curSpot = null, curTower = null;

function closePanel(){
  panel.classList.remove('on');
  curSpot = null; curTower = null;
  if(G.towers) G.towers.forEach(t=>t.sel = false);
}
function openPanel(){ panel.classList.add('on'); panelMsg.textContent=''; }

function buildTower(key, spot){
  const cfg = TOWERS[key];
  if(G.coins < cfg.cost){ panelMsg.textContent = '金币不够，先打几波'; return; }
  G.coins -= cfg.cost; syncHud();
  const t = {key, kind:cfg.kind, x:spot.x, y:spot.y, sx:spot.x, sy:spot.y,
             lv:1, dmg:cfg.dmg, cdMax:cfg.cd, cd:0, range:cfg.range, color:cfg.color, sel:false};
  G.towers.push(t);
  addParts(spot.x, spot.y, 14, cfg.color, 3.4);
  closePanel();
}

function openSpotPanel(spot){
  closePanel();
  curSpot = spot;
  panelTitle.textContent = '这个位置建什么塔';
  opts.innerHTML = '';
  Object.keys(TOWERS).forEach(k=>{
    const c = TOWERS[k];
    const el = document.createElement('div');
    el.className = 'opt' + (G.coins < c.cost ? ' poor' : '');
    el.innerHTML = '<img src="' + c.img + '" alt=""><span class="nm">' + c.name +
      '</span><span class="pr">' + c.cost + ' 金币</span>';
    el.addEventListener('click', ()=> buildTower(k, spot));
    opts.appendChild(el);
  });
  panelRow.innerHTML = '<button id="btnClose1">取消</button>';
  document.getElementById('btnClose1').onclick = closePanel;
  openPanel();
}

function openTowerPanel(t){
  closePanel();
  curTower = t; t.sel = true;
  const cfg = TOWERS[t.key];
  const upCost = Math.round(cfg.cost * (t.lv === 1 ? UPGRADE[1] : UPGRADE[2]));
  const sell = Math.round(cfg.cost * (0.6 + t.lv*0.35));
  panelTitle.textContent = cfg.name + ' · Lv' + t.lv + '（伤害 ' + Math.round(t.dmg) + '）';
  opts.innerHTML = '';
  panelRow.innerHTML = '';
  if(t.lv < 3){
    const up = document.createElement('button');
    up.className = 'primary';
    up.textContent = '升到 Lv' + (t.lv+1) + ' · ' + upCost + ' 金币';
    up.onclick = () => {
      if(G.coins < upCost){ panelMsg.textContent = '金币不够'; return; }
      G.coins -= upCost; syncHud();
      t.lv++; t.dmg = Math.round(t.dmg * 1.7); t.range += 14; t.cdMax *= 0.88;
      addParts(t.x, t.y, 16, cfg.color, 3.6);
      openTowerPanel(t);
    };
    panelRow.appendChild(up);
  }else{
    panelMsg.textContent = '已经满级了';
  }
  const del = document.createElement('button');
  del.textContent = '卖掉 +' + sell;
  del.onclick = () => {
    G.coins += sell; syncHud();
    G.towers = G.towers.filter(x=>x!==t);
    addParts(t.x, t.y, 12, '#8a94a2', 3);
    closePanel();
  };
  panelRow.appendChild(del);
  openPanel();
}

cv.addEventListener('pointerdown', ev=>{
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) * (W / r.width);
  const y = (ev.clientY - r.top) * (H / r.height);

  for(const t of G.towers){
    if(Math.hypot(t.x-x, (t.y+4)-y) < 34){ openTowerPanel(t); return; }
  }
  for(const s of SPOTS){
    const occupied = G.towers.some(t=>t.sx===s.x && t.sy===s.y);
    if(!occupied && Math.hypot(s.x-x, (s.y+6)-y) < 34){ openSpotPanel(s); return; }
  }
  closePanel();
});

btnWave.addEventListener('click', startWave);
btnSpeed.addEventListener('click', ()=>{
  G.speed = G.speed === 1 ? 2 : 1;
  btnSpeed.textContent = '×' + G.speed;
});
btnPause.addEventListener('click', ()=>{
  G.paused = !G.paused;
  btnPause.textContent = G.paused ? '继续' : '暂停';
});
document.getElementById('btnAgain').addEventListener('click', ()=>{
  reset();
  btnWave.textContent = '开始第 1 波';
});

addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); btnPause.click(); }
});

/* ================= 启动 ================= */
Promise.all(ALL_IMGS.map(([k,src]) => loadImg(k, src))).then(()=>{
  reset();
  requestAnimationFrame(frame);
});
</script>
