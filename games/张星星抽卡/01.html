<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0910">
<title>收藏集 · 抽卡</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#0a0910;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --txt:#e9e7f0;
  --txt-3:#565268;
  --gold:#dfae5e;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{
  height:100%;
  background:
    radial-gradient(900px 560px at 50% -8%, #1c1630 0%, transparent 62%),
    radial-gradient(700px 520px at 88% 108%, #131024 0%, transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

/* ============ 星空 ============ */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl);}
@keyframes twinkle{0%,100%{opacity:.08;}50%{opacity:.55;}}

/* ============ 布局 ============ */
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  padding-top:calc(18px + var(--safe-t));
  padding-left:calc(28px + var(--safe-l));
  padding-right:calc(28px + var(--safe-r));
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand-mark{
  width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#241804;
  background:linear-gradient(160deg,#f6dda6,#dfae5e 55%,#b9863a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 10px rgba(0,0,0,.45);
}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.brand-text strong{font-size:13.5px;font-weight:600;letter-spacing:.14em;color:#ece9f4;white-space:nowrap;}
.brand-text span{font-size:8.5px;letter-spacing:.22em;color:var(--txt-3);white-space:nowrap;}
.top-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

.gem-pill{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 11px;
  border-radius:8px;background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px var(--line-2);flex:none;
}
.gem-icon{width:11px;height:11px;flex:none;
  background:linear-gradient(150deg,#bfe9ff,#5bb6e8);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  filter:drop-shadow(0 0 4px rgba(91,182,232,.8));}
#gemCount{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;color:#d5eefb;min-width:30px;text-align:right;}
.gem-add{width:20px;height:20px;flex:none;border:none;border-radius:5px;cursor:pointer;
  font-size:13px;line-height:1;font-weight:700;color:#9dd8f5;
  background:rgba(91,182,232,.14);transition:.16s;}
.gem-add:hover{background:rgba(91,182,232,.3);}

.progress{display:flex;align-items:center;gap:9px;flex:none;}
.progress-track{width:clamp(56px,20vw,110px);height:3px;border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.08);}
.progress-track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8b6fd4,var(--gold));
  transition:width .7s cubic-bezier(.25,.9,.3,1);}
.progress span{font-size:10.5px;font-family:ui-monospace,monospace;color:var(--txt-3);letter-spacing:.04em;}

.btn-line{height:32px;padding:0 15px;border:none;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.18em;
  color:#cfc9dd;background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:.18s;flex:none;}
.btn-line:hover{background:rgba(255,255,255,.09);color:#fff;}

/* ---------- 主舞台 ---------- */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,3.4vh,36px);min-height:0;
  padding:0 24px 4vh;
  padding-bottom:calc(4vh + var(--safe-b));
  padding-left:calc(24px + var(--safe-l));
  padding-right:calc(24px + var(--safe-r));
}

/* ============ 卡池封面(轮播) ============ */
.cover{
  position:relative;width:clamp(180px,42vmin,238px);aspect-ratio:3/4.15;
  border-radius:14px;padding:1px;flex:none;
  background:linear-gradient(155deg,rgba(223,174,94,.55),rgba(223,174,94,.06) 42%,rgba(255,255,255,.05) 100%);
  box-shadow:0 28px 64px -26px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.5);
  animation:float 7s ease-in-out infinite;
  cursor:pointer;
}
@keyframes float{0%,100%{transform:translateY(-5px);}50%{transform:translateY(5px);}}

.cover-frame{
  position:relative;height:100%;border-radius:13px;overflow:hidden;
  background: #0d0b16;
  display:flex;flex-direction:column;justify-content:space-between;
}
.cover-frame::before{content:'';position:absolute;inset:8px;border-radius:9px;
  border:1px solid rgba(223,174,94,.15);pointer-events:none;z-index:5;}
.cover-frame::after{content:'';position:absolute;top:-50%;left:-60%;width:180%;height:180%;
  background:linear-gradient(118deg,transparent 44%,rgba(255,255,255,.15) 50%,transparent 56%);
  animation:sweep 6s ease-in-out infinite;pointer-events:none;z-index:5;}
@keyframes sweep{0%,100%{transform:translate(-24%,-24%);}50%{transform:translate(24%,24%);}}

/* 轮播图层 */
.cover-carousel{
  position:absolute;inset:0;z-index:1;background:#0a0910;
}
.c-slide{
  position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;
  display:flex;align-items:center;justify-content:center;
}
.c-slide.active{opacity:1;z-index:2;}
.c-slide img{
  width:100%;height:100%;
  /* 修改为 contain，完整展示轮播图 */
  object-fit:contain;
  filter:brightness(.85) contrast(1.05);
}
.c-slide .c-init{
  font-size:40px;font-weight:800;color:rgba(255,255,255,.2);
}

/* 渐变遮罩（保证文字清晰） */
.cover-overlay{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to top, rgba(8,6,14,.95) 0%, rgba(8,6,14,.4) 30%, transparent 60%),
             linear-gradient(to bottom, rgba(8,6,14,.6) 0%, transparent 25%);
}

/* 封面文字层 */
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:10;padding:16px 15px 0;}
.cover-label{font-size:8px;letter-spacing:.3em;color:rgba(223,174,94,.8);font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.8);}
.cover-no{font-size:8px;font-family:ui-monospace,monospace;letter-spacing:.1em;color:rgba(255,255,255,.6);text-shadow:0 1px 4px rgba(0,0,0,.8);}

.cover-bot{position:relative;z-index:10;padding:0 15px 16px;display:flex;justify-content:space-between;align-items:flex-end;}
.cover-title-wrap{display:flex;flex-direction:column;gap:4px;}
.cover-main{font-size:9px;letter-spacing:.2em;color:var(--gold);opacity:.8;}
.cover-title{font-size:clamp(14px,3vmin,18px);font-weight:700;letter-spacing:.1em;color:#f2e8d4;text-shadow:0 1px 8px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.cover-bot em{font-style:normal;font-size:8.5px;letter-spacing:.1em;color:rgba(223,174,94,.7);}


/* ---------- 按钮 ---------- */
.actions{display:flex;gap:14px;flex:none;}
.btn{
  position:relative;border:none;cursor:pointer;font-family:inherit;
  height:52px;min-width:142px;padding:0 26px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,opacity .2s;
  touch-action:manipulation;
}
.btn:active{transform:scale(.975);}
.btn-main{font-size:14.5px;font-weight:700;letter-spacing:.22em;line-height:1;}
.btn-sub{font-size:9px;letter-spacing:.14em;opacity:.62;line-height:1;}
.btn-primary{
  color:#2b1e06;
  background:linear-gradient(180deg,#f7dfa8 0%,#e5b765 48%,#cb9440 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(120,78,18,.35),
    0 8px 22px -8px rgba(215,165,80,.6),0 2px 6px rgba(0,0,0,.4);
}
.btn-primary:hover{transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(120,78,18,.35),
    0 14px 30px -8px rgba(215,165,80,.78),0 2px 6px rgba(0,0,0,.4);}
.btn-ghost{
  color:#d8cbb0;background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px rgba(223,174,94,.35),inset 0 1px 0 rgba(255,255,255,.06),
    0 6px 18px -10px rgba(0,0,0,.8);
}
.btn-ghost:hover{transform:translateY(-2px);background:rgba(223,174,94,.08);
  box-shadow:inset 0 0 0 1px rgba(223,174,94,.6),inset 0 1px 0 rgba(255,255,255,.1),
    0 10px 24px -10px rgba(0,0,0,.9);}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none!important;}

/* 概率公示 */
.odds{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  font-size:9.5px;letter-spacing:.08em;color:var(--txt-3);
  padding:0 4px;text-align:center;
}
.odds i{font-style:normal;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.odds i::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;
  box-shadow:0 0 6px currentColor;flex:none;}
.odds .o-big{color:#f0c14b;}
.odds .o-small{color:#a78bfa;}
.odds .o-common{color:#7d9ec4;}
.odds b{font-weight:600;font-family:ui-monospace,monospace;font-size:10px;}

/* ============ 抽卡结果 ============ */
.overlay{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}
.overlay.show{opacity:1;visibility:visible;}
#resultOverlay{
  background:radial-gradient(ellipse 70% 55% at 50% 46%, rgba(36,27,70,.92), rgba(6,5,11,.985) 72%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#resultOverlay[data-top="big"]{
  background:radial-gradient(ellipse 70% 55% at 50% 46%, rgba(72,52,14,.94), rgba(8,6,10,.985) 72%);
}
#resultOverlay[data-top="small"]{
  background:radial-gradient(ellipse 70% 55% at 50% 46%, rgba(46,30,88,.94), rgba(6,5,11,.985) 72%);
}

.flash{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(circle at 50% 50%,
    #fff 0%, rgba(255,244,214,.62) 18%, rgba(255,190,110,.18) 40%, transparent 62%);}
.flash.run{animation:flashA .72s cubic-bezier(.2,.7,.3,1);}
@keyframes flashA{0%{opacity:0;transform:scale(.55);}22%{opacity:1;transform:scale(1.04);}
  100%{opacity:0;transform:scale(1.45);}}

.reveal{position:relative;z-index:3;display:grid;gap:clamp(7px,1.4vw,15px);padding:0 18px;width:100%;}
.reveal.multi{grid-template-columns:repeat(5,1fr);max-width:600px;}
.reveal.single{grid-template-columns:1fr;max-width:228px;}

.hint{position:absolute;bottom:calc(5.5vh + var(--safe-b));z-index:5;pointer-events:none;
  font-size:10.5px;letter-spacing:.34em;color:rgba(255,255,255,.34);
  opacity:0;transition:opacity .4s;}
.hint.show{opacity:1;animation:hintA 2.4s ease-in-out infinite;}
@keyframes hintA{0%,100%{opacity:.22;}50%{opacity:.62;}}

.skip{position:absolute;right:calc(24px + var(--safe-r));bottom:calc(5.5vh + var(--safe-b) - 5px);z-index:6;
  border:none;cursor:pointer;font-family:inherit;height:28px;padding:0 16px;
  border-radius:99px;font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);
  opacity:0;visibility:hidden;transition:.25s;touch-action:manipulation;}
.skip.show{opacity:1;visibility:visible;}
.skip:hover{background:rgba(255,255,255,.13);color:#fff;}

.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20;}
.burst i{position:absolute;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#e8c06a 55%,transparent 72%);
  animation:burstA 1s cubic-bezier(.15,.8,.3,1) forwards;}
@keyframes burstA{0%{transform:translate(0,0) scale(1.4);opacity:1;}
  100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}}

/* ============ 卡牌 ============ */
.card-wrap{
  position:relative;aspect-ratio:3/4.25;
  container-type:inline-size;
  opacity:0;transform:translateY(26px) scale(.92);
  animation:cardIn .48s cubic-bezier(.22,.9,.3,1.05) forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}

.card{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:perspective(1100px) rotateY(0deg);
  transition:transform .72s cubic-bezier(.28,.9,.32,1);
}
.card-wrap.flipped .card{transform:perspective(1100px) rotateY(180deg);}

.face{
  position:absolute;inset:0;border-radius:9px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}

.card-back{
  background:linear-gradient(158deg,#1e1834,#100d1c 58%,#1a1430);
  box-shadow:inset 0 0 0 1px rgba(223,174,94,.16),inset 0 0 34px rgba(90,60,160,.28);
  display:grid;place-items:center;
}
.card-back span{
  font-size:22cqw;color:rgba(223,174,94,.32);
  text-shadow:0 0 18px rgba(223,174,94,.55);
  animation:backPulse 2.6s ease-in-out infinite;
}
@keyframes backPulse{0%,100%{opacity:.45;transform:scale(.94);}50%{opacity:1;transform:scale(1.06);}}

.card-front{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;
  background:#0c0a14;
  box-shadow:inset 0 0 0 1px rgba(var(--c-rgb),.5),0 0 18px -8px rgba(var(--c-rgb),.5);
}
.card-front[data-rarity="common"]{--c:#7d9ec4;--c-rgb:125,158,196;}
.card-front[data-rarity="small"] {--c:#a78bfa;--c-rgb:167,139,250;}
.card-front[data-rarity="big"]   {--c:#f0c14b;--c-rgb:240,193,75;}

.card-wrap.flipped .card-front{animation:pop .42s ease-out;}
@keyframes pop{
  0%{transform:rotateY(180deg) scale(1);}
  46%{transform:rotateY(180deg) scale(1.055);}
  100%{transform:rotateY(180deg) scale(1);}
}

.card-img{
  position:relative;flex:1;overflow:hidden;
  background:linear-gradient(162deg,rgba(var(--c-rgb),.22) 0%,#0c0a14 86%);
}
/* 修改为 contain，确保抽卡结果图片完整展示 */
.card-img img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;
}
.card-init{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:27cqw;font-weight:800;color:rgba(var(--c-rgb),.85);
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

.card-meta{
  padding:5.2cqw 5.6cqw 5.6cqw;
  background:linear-gradient(180deg,rgba(10,8,18,.08),rgba(8,6,14,.97) 55%);
  display:flex;flex-direction:column;gap:1.4cqw;
}
.card-name{
  font-size:8.6cqw;font-weight:600;letter-spacing:.02em;color:#f1eef8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-no{
  font-size:6.1cqw;font-family:ui-monospace,monospace;letter-spacing:.1em;
  color:rgba(var(--c-rgb),.9);
}

.tag{
  position:absolute;top:4.6cqw;right:4.6cqw;z-index:5;
  padding:1.6cqw 5cqw;border-radius:4px;
  font-size:5.8cqw;font-weight:800;letter-spacing:.06em;color:#150d02;
  background:linear-gradient(180deg,#fff,var(--c));
  box-shadow:0 1px 6px rgba(0,0,0,.5);
}
.new{
  position:absolute;top:4.6cqw;left:4.6cqw;z-index:5;
  padding:1.4cqw 4.4cqw;border-radius:4px;
  font-size:5.2cqw;font-weight:800;letter-spacing:.08em;color:#08281b;
  background:linear-gradient(180deg,#c6ffdf,#43e08d);
  box-shadow:0 1px 6px rgba(0,0,0,.5);
}

.card-front[data-rarity="small"]::after,
.card-front[data-rarity="big"]::after{
  content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.2) 48%,transparent 58%);
  background-size:270% 270%;
  animation:shine 3.8s linear infinite;opacity:.75;
}
.card-front[data-rarity="big"]::after{animation-duration:2.4s;background-size:240% 240%;opacity:.9;}
@keyframes shine{0%{background-position:-120% 0;}100%{background-position:220% 0;}}

.card-front[data-rarity="big"]{
  box-shadow:
    inset 0 0 0 1px rgba(240,193,75,.9),
    inset 0 0 0 3px rgba(240,193,75,.12),
    0 0 24px -4px rgba(240,193,75,.6);
}

.card-wrap.anticipate .card{animation:anti .5s ease-in-out;}
@keyframes anti{
  0%,100%{transform:perspective(1100px) rotateY(0) translateX(0);}
  18%{transform:perspective(1100px) rotateY(0) translateX(-3px);}
  36%{transform:perspective(1100px) rotateY(0) translateX(3px);}
  54%{transform:perspective(1100px) rotateY(0) translateX(-2px);}
  72%{transform:perspective(1100px) rotateY(0) translateX(2px);}
}

/* ============ 图鉴 ============ */
#galleryOverlay{
  z-index:70;justify-content:flex-start;align-items:stretch;
  background:linear-gradient(172deg,#0f0d18 0%,#08070e 56%,#0c0a14 100%);
}
.gal-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:20px 26px 14px;border-bottom:1px solid var(--line);
  padding-top:calc(20px + var(--safe-t));
  padding-left:calc(26px + var(--safe-l));
  padding-right:calc(26px + var(--safe-r));
}
.gal-title{display:flex;align-items:baseline;gap:12px;}
.gal-title h2{font-size:14px;font-weight:700;letter-spacing:.26em;color:#e6dcc6;}
.gal-title span{font-size:10.5px;font-family:ui-monospace,monospace;color:var(--txt-3);letter-spacing:.06em;}
.gal-close{
  width:32px;height:32px;flex:none;border:none;border-radius:8px;cursor:pointer;
  font-size:14px;color:#b6b0c8;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:.18s;
}
.gal-close:hover{background:rgba(255,255,255,.12);color:#fff;}

.gal-body{
  flex:1;min-height:0;overflow-y:auto;padding:22px 26px 44px;
  padding-bottom:calc(44px + var(--safe-b));
  padding-left:calc(26px + var(--safe-l));
  padding-right:calc(26px + var(--safe-r));
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.gal-body::-webkit-scrollbar{width:5px;}
.gal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;}

.group{margin-bottom:30px;}
.group:last-child{margin-bottom:0;}
.group-head{
  display:flex;align-items:center;gap:9px;margin-bottom:13px;
  font-size:11.5px;font-weight:600;letter-spacing:.2em;
}
.group-head .dot{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;flex:none;}
.group-head .num{
  margin-left:auto;font-size:10px;font-family:ui-monospace,monospace;
  color:var(--txt-3);letter-spacing:.06em;font-weight:400;
}
.group-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}

.grid{
  display:grid;gap:11px;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
}
.g-card{
  position:relative;aspect-ratio:3/4.2;border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,#161326,#0a0812);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);
  display:flex;flex-direction:column;
  transition:transform .2s,box-shadow .2s;

}
.g-card[data-rarity="common"]{--c:#7d9ec4;--c-rgb:125,158,196;}
.g-card[data-rarity="small"] {--c:#a78bfa;--c-rgb:167,139,250;}

.g-card.owned{
  cursor:pointer;

}

  transform:translateY(-3px);
  box-shadow:inset 0 0 0 1px var(--c),0 8px 20px -8px rgba(0,0,0,.9);
}

.g-img{position:relative;flex:1;overflow:hidden;
  background:linear-gradient(160deg,#191527,#0a0812 88%);}
.g-card.owned .g-img{
  background:linear-gradient(160deg,rgba(var(--c-rgb),.26),#0a0812 88%);
}
/* 修改为 contain，确保图鉴图片完整展示 */
.g-img img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;
}
.g-init{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:26cqw;font-weight:800;color:rgba(var(--c-rgb),.9);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.g-card:not(.owned) .g-img::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 7px,transparent 7px 14px);
}
.g-q{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:22cqw;font-weight:700;color:rgba(255,255,255,.1);
}

.g-foot{
  padding:4px 5px 5px;font-size:8.5px;letter-spacing:.02em;
  color:#a8a2bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

.g-no{
  position:absolute;top:3px;left:4px;z-index:3;

}
.g-dup{
  position:absolute;bottom:22px;right:4px;z-index:3;
  padding:1px 4px;border-radius:3px;
  font-size:7px;font-family:ui-monospace,monospace;color:#fff;
  background:rgba(0,0,0,.66);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}

#lightbox{
  z-index:80;background:rgba(5,4,9,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.lb-card{
  width:min(320px,80vw);aspect-ratio:3/4.25;
  animation:lbIn .34s cubic-bezier(.22,.9,.3,1.15);

}
@keyframes lbIn{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
.lb-close{
  position:absolute;top:calc(24px + var(--safe-t));right:calc(24px + var(--safe-r));z-index:5;
  width:36px;height:36px;border:none;border-radius:9px;cursor:pointer;
  font-size:15px;color:#c4bed6;background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:.18s;
}
.lb-close:hover{background:rgba(255,255,255,.15);color:#fff;}

.toast{
  position:fixed;left:50%;bottom:calc(11vh + var(--safe-b));transform:translate(-50%,14px);z-index:100;
  padding:10px 20px;border-radius:8px;
  font-size:12px;letter-spacing:.1em;color:#e8e5f0;
  background:rgba(22,18,36,.96);
  box-shadow:inset 0 0 0 1px var(--line-2),0 12px 30px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transition:.28s;max-width:84vw;text-align:center;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}

/* ============ 触屏：去掉 hover 位移残留 ============ */
@media (hover:none){

}

/* ============ 响应式 ============ */
@media (max-width:760px){
  .topbar{

  }

  .top-actions{gap:7px;flex:1;justify-content:flex-end;flex-wrap:nowrap;}
  .gem-pill{height:30px;padding:0 4px 0 9px;gap:6px;}
  #gemCount{font-size:11px;min-width:26px;}

  .stage{gap:20px;padding:0 16px 3.5vh;

  .grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;}

/* 超窄屏：隐藏进度条，品牌文字省略 */
@media (max-width:400px){
  .brand-text strong{font-size:11.5px;}

  .reveal.multi{grid-template-columns:repeat(3,1fr);}

}

/* 矮屏（横屏手机 / 小窗） */
@media (max-height:660px) and (min-width:761px){
  .stage{gap:14px;padding-bottom:2vh;}

/* 横屏手机：封面与按钮并排 */
@media (orientation:landscape) and (max-height:560px){

  .reveal.multi{max-width:min(70vw,520px);}
}

</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-text">
        <strong>收藏集</strong>
        <span>STAR SEA COLLECTION</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="gem-pill">
        <span class="gem-icon"></span>
        <span id="gemCount">200</span>
        <button class="gem-add" id="gemAdd" title="补充星石">+</button>
      </div>
      <div class="progress">
        <div class="progress-track"><i id="progFill"></i></div>
        <span id="progText">0/17</span>
      </div>
      <button class="btn-line" id="btnGallery">图 鉴</button>
    </div>
  </header>

  <main class="stage">
    <!-- 封面改造成轮播图 -->
    <div class="cover" id="coverCard">
      <div class="cover-frame">
        <!-- 轮播容器 -->
        <div class="cover-carousel" id="carousel"></div>
        <!-- 文字遮罩 -->
        <div class="cover-overlay"></div>

        <!-- 顶部信息 -->
        <div class="cover-top">
          <span class="cover-label">COLLECTION</span>
          <span class="cover-no" id="coverNo">NO.01</span>
        </div>
        <!-- 底部信息 -->
        <div class="cover-bot">
          <div class="cover-title-wrap">
            <span class="cover-main">收藏集 · 展示</span>
            <span class="cover-title" id="coverTitle">加载中...</span>
          </div>
          <em>LIMITED</em>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-ghost" id="btn1">
        <span class="btn-main">单 抽</span>
        <span class="btn-sub">20 星石</span>
      </button>
      <button class="btn btn-primary" id="btn5">
        <span class="btn-main">五 连</span>
        <span class="btn-sub">100 星石</span>
      </button>
    </div>

    <div class="odds">
      <i class="o-big">大隐藏 <b>1.5%</b></i>
      <i class="o-small">小隐藏 <b>5%</b></i>
      <i class="o-common">常规 <b>93.5%</b>（14款均摊）</i>
    </div>
  </main>
</div>

<!-- 抽卡结果 -->
<div class="overlay" id="resultOverlay">
  <div class="flash" id="flash"></div>
  <div class="reveal multi" id="reveal"></div>
  <div class="hint" id="hint">点 击 任 意 处 继 续</div>
  <button class="skip" id="skipBtn">全部展示</button>
</div>

<!-- 图鉴 -->
<div class="overlay" id="galleryOverlay">
  <div class="gal-head">
    <div class="gal-title">
      <h2>图 鉴</h2>
      <span id="galSub">0 / 17</span>
    </div>
    <button class="gal-close" id="galClose">✕</button>
  </div>
  <div class="gal-body" id="galBody"></div>
</div>

<!-- 大图 -->
<div class="overlay" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-card" id="lbCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   ① 卡池配置
   rarity: 'big' 大隐藏 ×1 | 'small' 小隐藏 ×2 | 'common' 常规 ×14
   img 换成你自己的图片路径即可（支持相对路径或网址）
   ========================================================== */
const POOL = [
  { id:'b01', no:1,  name:'武魂真身', rarity:'big',    img:'13.png.jpg'  },
  { id:'s01', no:2,  name:'萌妹', rarity:'small',  img:'1.png.jpg'  },
  { id:'s02', no:3,  name:'怼脸大头', rarity:'small',  img:'2.png.jpg'  },
  { id:'c01', no:4,  name:'工作模式', rarity:'common', img:'3.png.jpg'  },
  { id:'c02', no:5,  name:'奶龙帝王', rarity:'common', img:'4.png.jpg'  },
  { id:'c03', no:6,  name:'糊咖', rarity:'common', img:'5.png.jpg'  },
  { id:'c04', no:7,  name:'深沉思考', rarity:'common', img:'6.png.jpg'  },
  { id:'c05', no:8,  name:'迷茫', rarity:'common', img:'7.png.jpg'  },
  { id:'c06', no:9,  name:'奶龙展示', rarity:'common', img:'8.png.jpg'  },
  { id:'c07', no:10, name:'休闲形态', rarity:'common', img:'9.png.jpg'  },
  { id:'c08', no:11, name:'王的背影', rarity:'common', img:'10.png.jpg'  },
  { id:'c09', no:12, name:'9+1形态', rarity:'common', img:'11.png.jpg'  },
  { id:'c10', no:13, name:'双手环抱', rarity:'common', img:'12.png.jpg'  },
  { id:'c11', no:14, name:'惊鸿一瞥', rarity:'common', img:'14.png.jpg'  },
  { id:'c12', no:15, name:'请输入文本', rarity:'common', img:'15.png.jpg'  },
  { id:'c13', no:16, name:'耶', rarity:'common', img:'16.png.jpg'  },
  { id:'c14', no:17, name:'饭撒',  rarity:'common', img:'18.png.jpg'  },
];

/* ==========================================================
   ② 品质配置（weight 即百分比，总和 100）
   ========================================================== */
const RARITY = {
  common: { label:'常规',   weight: 93.5, color:'#7d9ec4' },
  small:  { label:'小隐藏', weight: 5,    color:'#a78bfa' },
  big:    { label:'大隐藏', weight: 1.5,  color:'#f0c14b' },
};
const RARITY_KEYS = ['big','small','common'];
const RARITY_RANK = { common:0, small:1, big:2 };

/* ==========================================================
   ③ 抽卡规则（无保底，纯独立概率）
   ========================================================== */
// 单抽20，五连100
const COST = { 1:20, 5:100 };

/* ==========================================================
   ④ 逻辑
   ========================================================== */
const $ = s => document.querySelector(s);
const resultOverlay  = $('#resultOverlay');
const galleryOverlay = $('#galleryOverlay');
const lightbox       = $('#lightbox');
const reveal = $('#reveal');
const flash  = $('#flash');
const hint   = $('#hint');
const skipBtn= $('#skipBtn');

const STORAGE_KEY = 'oc_collection_v7';
const sleep = ms => new Promise(r => setTimeout(r, ms));

let owned = {};
let gems  = 200;
let busy  = false;
let canClose = false;
let skipped  = false;

try { owned = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch(e){ owned = {}; }

/* ---------- 星空 ---------- */
(function stars(){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 120; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 1.8 + 0.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 100 + '%';
    s.style.setProperty('--d',  (2.5 + Math.random() * 4) + 's');
    s.style.setProperty('--dl', (Math.random() * 5) + 's');
    frag.appendChild(s);
  }
  $('#stars').appendChild(frag);
})();

/* ---------- 封面轮播逻辑 ---------- */
let carouselIndex = 0;
let carouselTimer = null;

function initCarousel() {
  const carousel = $('#carousel');
  if (!POOL.length) return;

  // 生成所有幻灯片
  POOL.forEach((item, index) => {
    const slide = document.createElement('div');
    slide.className = 'c-slide' + (index === 0 ? ' active' : '');

    if (item.img) {
      const img = new Image();
      img.src = item.img;
      img.alt = item.name;
      img.addEventListener('error', () => {
        img.remove(); // 加载失败时显示文字
        slide.innerHTML = `<span class="c-init">${item.name.trim().charAt(0)}</span>`;
      });
      slide.appendChild(img);
    } else {
      slide.innerHTML = `<span class="c-init">${item.name.trim().charAt(0)}</span>`;
    }

    carousel.appendChild(slide);
  });

  // 更新文字
  updateCoverInfo(0);

  // 开始自动轮播
  startCarouselTimer();

  // 点击卡片手动切换下一张
  $('#coverCard').addEventListener('click', () => {
    nextCarousel();
    startCarouselTimer(); // 点击后重置定时器
  });
}

function updateCoverInfo(index) {
  const item = POOL[index];
  if (!item) return;
  const noStr = String(item.no).padStart(2, '0');
  $('#coverNo').textContent = `NO.${noStr}`;
  $('#coverTitle').textContent = item.name;
}

function nextCarousel() {
  const slides = document.querySelectorAll('.c-slide');
  if (slides.length <= 1) return;

  slides[carouselIndex].classList.remove('active');
  carouselIndex = (carouselIndex + 1) % slides.length;
  slides[carouselIndex].classList.add('active');

  updateCoverInfo(carouselIndex);
}

function startCarouselTimer() {
  if (carouselTimer) clearInterval(carouselTimer);
  carouselTimer = setInterval(nextCarousel, 3000); // 3秒切换一次
}

// 初始化轮播
initCarousel();


/* ---------- 星石 ---------- */
function updateGems(){
  $('#gemCount').textContent = gems;
  $('#btn1').disabled  = gems < COST[1];
  $('#btn5').disabled  = gems < COST[5];
}
$('#gemAdd').addEventListener('click', () => {
  gems += 200; updateGems(); toast('星石 +200');
});

/* ---------- 进度 ---------- */
function updateProgress(){
  const total = POOL.length;
  const got = POOL.filter(c => owned[c.id] > 0).length;
  $('#progFill').style.width = total ? (got / total * 100) + '%' : '0%';
  $('#progText').textContent = got + '/' + total;
  $('#galSub').textContent = got + ' / ' + total;
}
function saveOwned(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(owned)); } catch(e){}
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- 抽卡算法 ---------- */
function pickRarity(){
  const keys = Object.keys(RARITY).filter(k => POOL.some(c => c.rarity === k));
  if (!keys.length) return null;
  let total = 0;
  const buckets = [];
  for (const k of keys){
    total += RARITY[k].weight;
    buckets.push({ k, upTo: total });
  }
  const roll = Math.random() * total;
  for (const b of buckets) if (roll < b.upTo) return b.k;
  return keys[keys.length - 1];
}
function pickItem(rarity){
  const list = POOL.filter(c => c.rarity === rarity);
  if (!list.length) return null;
  return list[Math.floor(Math.random() * list.length)];
}
function drawOne(){
  const r = pickRarity();
  return r ? pickItem(r) : POOL[0];
}
function drawMany(n){
  const res = [];
  for (let i = 0; i < n; i++) res.push(drawOne());
  return res.filter(Boolean);
}

/* ---------- 生成卡片 ---------- */
function makeCard(item, isNew){
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  const initial = (item.name || '?').trim().charAt(0);
  const no = String(item.no || 0).padStart(2, '0');

  wrap.innerHTML = `
    <div class="card">
      <div class="face card-back"><span>✦</span></div>
      <div class="face card-front" data-rarity="${item.rarity}">
        <div class="card-img"><span class="card-init">${initial}</span></div>
        <div class="card-meta">
          <span class="card-name">${item.name}</span>
          <span class="card-no">NO.${no}</span>
        </div>
        <span class="tag">${RARITY[item.rarity].label}</span>
        ${isNew ? '<span class="new">NEW</span>' : ''}
      </div>
    </div>`;

  if (item.img){
    const img = new Image();
    img.alt = item.name;
    img.addEventListener('error', () => img.remove());
    img.src = item.img;
    wrap.querySelector('.card-img').appendChild(img);
  }
  return wrap;
}

/* ---------- 粒子 ---------- */
function burst(){
  const b = document.createElement('div');
  b.className = 'burst';
  for (let i = 0; i < 24; i++){
    const p = document.createElement('i');
    const a = (i / 24) * Math.PI * 2 + Math.random() * .28;
    const d = 100 + Math.random() * 150;
    p.style.setProperty('--x', (Math.cos(a) * d).toFixed(1) + 'px');
    p.style.setProperty('--y', (Math.sin(a) * d).toFixed(1) + 'px');
    p.style.animationDelay = (Math.random() * .1).toFixed(2) + 's';
    b.appendChild(p);
  }
  resultOverlay.appendChild(b);
  setTimeout(() => b.remove(), 1500);
}

/* ---------- 抽卡流程 ---------- */
async function doDraw(count){
  if (busy) return;
  const cost = COST[count];
  if (gems < cost){ toast('星石不足，点击 + 补充'); return; }

  gems -= cost; updateGems();
  busy = true; canClose = false; skipped = false;

  const results = drawMany(count);
  if (!results.length){ toast('卡池为空'); busy = false; return; }

  const newFlags = results.map(item => {
    const isNew = !owned[item.id];
    owned[item.id] = (owned[item.id] || 0) + 1;
    return isNew;
  });
  saveOwned(); updateProgress();

  let top = 'common';
  results.forEach(c => { if (RARITY_RANK[c.rarity] > RARITY_RANK[top]) top = c.rarity; });
  resultOverlay.dataset.top = top;

  reveal.innerHTML = '';
  reveal.className = 'reveal ' + (count === 1 ? 'single' : 'multi');
  hint.classList.remove('show');
  skipBtn.classList.remove('show');
  resultOverlay.classList.add('show');

  flash.classList.remove('run');
  void flash.offsetWidth;
  flash.classList.add('run');

  await sleep(170);

  const cards = results.map((item, i) => {
    const el = makeCard(item, newFlags[i]);
    el.style.animationDelay = (i * 55) + 'ms';
    reveal.appendChild(el);
    return el;
  });

  await sleep(400);
  skipBtn.classList.add('show');

  for (let i = 0; i < cards.length; i++){
    if (skipped) break;
    const item = results[i];

    if (item.rarity === 'big'){
      cards[i].classList.add('anticipate');
      await sleep(520);
      if (skipped) break;
    }
    cards[i].classList.add('flipped');
    if (item.rarity === 'big') burst();

    await sleep(count === 1 ? 620 : 155);
  }

  if (skipped) cards.forEach(c => c.classList.add('flipped'));

  await sleep(380);
  skipBtn.classList.remove('show');
  hint.classList.add('show');
  canClose = true; busy = false;
}

skipBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!busy) return;
  skipped = true;
  skipBtn.classList.remove('show');
});

function closeResult(){
  resultOverlay.classList.remove('show');
  setTimeout(() => { reveal.innerHTML = ''; }, 320);
}

resultOverlay.addEventListener('click', () => {
  if (!canClose) return;
  canClose = false;
  closeResult();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (lightbox.classList.contains('show')){ lightbox.classList.remove('show'); return; }
    if (galleryOverlay.classList.contains('show')){ galleryOverlay.classList.remove('show'); return; }
    if (canClose){ canClose = false; closeResult(); }
  }
  if (!galleryOverlay.classList.contains('show') && !lightbox.classList.contains('show')){
    if (e.key === '1') doDraw(1);
    if (e.key === '0' || e.key === '5') doDraw(5);
  }
});

$('#btn1').addEventListener('click',  () => doDraw(1));
$('#btn5').addEventListener('click',  () => doDraw(5));

/* ==========================================================
   ⑤ 图鉴
   ========================================================== */
function buildGalleryCard(item){
  const isOwned = owned[item.id] > 0;
  const count = owned[item.id] || 0;
  const initial = (item.name || '?').trim().charAt(0);
  const no = String(item.no || 0).padStart(2, '0');

  const el = document.createElement('div');
  el.className = 'g-card' + (isOwned ? ' owned' : '');
  el.dataset.rarity = item.rarity;

  el.innerHTML = `
    <div class="g-img">
      ${isOwned ? `<span class="g-init">${initial}</span>` : `<span class="g-q">?</span>`}
    </div>
    <div class="g-foot">${isOwned ? item.name : '未解锁'}</div>
    <span class="g-no">NO.${no}</span>
    ${isOwned ? `<span class="g-tag">${RARITY[item.rarity].label}</span>` : ''}
    ${count > 1 ? `<span class="g-dup">×${count}</span>` : ''}
  `;

  if (isOwned && item.img){
    const img = new Image();
    img.alt = item.name;
    img.addEventListener('error', () => img.remove());
    img.src = item.img;
    el.querySelector('.g-img').appendChild(img);
  }

  if (isOwned) el.addEventListener('click', () => openLightbox(item));
  return el;
}

function renderGallery(){
  const body = $('#galBody');
  body.innerHTML = '';

  for (const key of RARITY_KEYS){
    const items = POOL.filter(c => c.rarity === key);
    if (!items.length) continue;
    const got = items.filter(c => owned[c.id] > 0).length;

    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = `
      <div class="group-head" style="color:${RARITY[key].color}">
        <span class="dot"></span>
        ${RARITY[key].label}
        <span class="rule"></span>
        <span class="num">${got} / ${items.length}</span>
      </div>
      <div class="grid"></div>`;

    const grid = group.querySelector('.grid');
    items.forEach(it => grid.appendChild(buildGalleryCard(it)));
    body.appendChild(group);
  }
}

/* ---------- 大图预览 ---------- */
function openLightbox(item){
  const initial = (item.name || '?').trim().charAt(0);
  const no = String(item.no || 0).padStart(2, '0');
  const lb = $('#lbCard');

  lb.innerHTML = `
    <div class="card" style="transform:none">
      <div class="face card-front" data-rarity="${item.rarity}" style="transform:none;border-radius:12px">
        <div class="card-img"><span class="card-init">${initial}</span></div>
        <div class="card-meta">
          <span class="card-name">${item.name}</span>
          <span class="card-no">NO.${no}</span>
        </div>
        <span class="tag">${RARITY[item.rarity].label}</span>
      </div>
    </div>`;

  if (item.img){
    const img = new Image();
    img.alt = item.name;
    img.addEventListener('error', () => img.remove());
    img.src = item.img;
    lb.querySelector('.card-img').appendChild(img);
  }
  lightbox.classList.add('show');
}

$('#lbClose').addEventListener('click', () => lightbox.classList.remove('show'));
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) lightbox.classList.remove('show');
});

$('#btnGallery').addEventListener('click', () => {
  renderGallery();
  galleryOverlay.classList.add('show');
});
$('#galClose').addEventListener('click', () => galleryOverlay.classList.remove('show'));

/* ---------- 初始化 ---------- */
updateGems();
updateProgress();
</script>
